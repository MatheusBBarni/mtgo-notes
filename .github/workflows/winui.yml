name: WinUI rewrite

on:
  pull_request:
  push:
    branches:
      - main
      - feat/winui-rewrite

permissions:
  contents: read

jobs:
  portable:
    name: Portable Core/Data/Live tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test portable projects
        run: |
          dotnet test winui/tests/MTGONotes.Core.Tests/MTGONotes.Core.Tests.csproj --nologo
          dotnet test winui/tests/MTGONotes.Data.Tests/MTGONotes.Data.Tests.csproj --nologo
          dotnet test winui/tests/MTGONotes.Live.Tests/MTGONotes.Live.Tests.csproj --nologo

  windows:
    name: Windows App restore
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and test
        run: |
          dotnet test winui/tests/MTGONotes.Core.Tests/MTGONotes.Core.Tests.csproj --nologo
          dotnet test winui/tests/MTGONotes.Data.Tests/MTGONotes.Data.Tests.csproj --nologo
          dotnet test winui/tests/MTGONotes.Live.Tests/MTGONotes.Live.Tests.csproj --nologo
      - name: Build unpackaged app
        run: dotnet build winui/MTGONotes.App/MTGONotes.App.csproj -c Release -r win-x64 --nologo
