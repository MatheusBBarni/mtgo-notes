[package]
name = "mtgo-opponent-notes"
version = "0.1.0"
description = "Private, local-first MTGO opponent notebook"
authors = ["MTGO Opponent Notes contributors"]
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "mtgo_opponent_notes"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
argon2 = { version = "=0.5.3", features = ["zeroize"] }
base64 = "=0.23.0"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls", "json", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.3"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
